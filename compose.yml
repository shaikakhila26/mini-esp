services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: mini_esp
      POSTGRES_USER: esp_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U esp_app -d mini_esp
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  campaign_api:
    build:
      context: ./services/campaign_api
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: mini_esp
      DB_USER: esp_app
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CAMPAIGN_API_KEY: ${CAMPAIGN_API_KEY:?Set CAMPAIGN_API_KEY in .env}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
  
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped

    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  grafana_data:
